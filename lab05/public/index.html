<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Engineering Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Office Hours</h1>

    <table id="schedule">
      <thead>
        <tr><th>Day</th><th>Time</th><th>Room</th><th>Action</th></tr>
      </thead>
      <tbody>
        <tr>
          <td>Monday</td><td>10:00-11:00</td><td>Room 214</td>
          <td><button type="button" data-day="Monday">Book</button></td>
        </tr>
        <tr>
          <td>Wednesday</td><td>14:00-15:00</td><td>Room 214</td>
          <td><button type="button" data-day="Wednesday">Book</button></td>
        </tr>
      </tbody>
    </table>

    <h2>Feedback</h2>

    
    <form novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <button type="submit">Send feedback</button>
    </form>

    <p id="status" role="status"></p>
  </main>

  
  <script type="module" src="main.js"></script>

  
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="legacy-feedback.js"></script>
   <script type="module" src="main.js"></script>
</body>
</html>
