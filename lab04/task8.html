
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task 8</title>
    <link rel="stylesheet" href="task8.css">
</head>
<body>

    <header>
        <h1>My Website</h1>

        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#schedule">Schedule</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="schedule">

            <div>
                <h2>Schedule an Appointment</h2>

                <form>
                    <h3 class="span-all">Appointment Form</h3>

                    <label>
                        Name
                        <input type="text" name="name" required>
                    </label>

                    <label>
                        Email
                        <input type="email" name="email" required>
                    </label>

                    <label>
                        Date
                        <input type="date" name="date">
                    </label>

                    <label>
                        Time
                        <input type="time" name="time">
                    </label>

                    <fieldset class="span-all">
                        <legend>Select a Service</legend>

                        <label>
                            <input type="radio" name="service" value="web">
                            Web Design
                        </label>

                        <label>
                            <input type="radio" name="service" value="support">
                            Technical Support
                        </label>
                    </fieldset>

                    <label class="span-all">
                        Message
                        <textarea name="message" rows="4"></textarea>
                    </label>

                    <button type="submit">Submit</button>
                </form>
            </div>

            <aside>
                <h3>Contact Information</h3>
                <p>Email: aurangzebkha313@gmail.com</p>
                <p>Phone: 0323-5555077</p>
                <p>Please contact us to schedule your appointment.</p>
            </aside>

        </section>
    </main>

</body>
</html>
