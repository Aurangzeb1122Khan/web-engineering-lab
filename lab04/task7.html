<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task 7</title>
    <link rel="stylesheet" href="task7.css">
</head>
<body>
    
<section id="schedule">
    <div>
        <h2 class="span-all">Schedule an Appointment</h2>

        <form>
            <label>
                Name
                <input type="text" name="name">
            </label>

            <label>
                Email
                <input type="email" name="email">
            </label>

            <fieldset class="span-all">
                <legend>Choose a service</legend>
                <label>
                    <input type="radio" name="service" value="web">
                    Web Design
                </label>
                <label>
                    <input type="radio" name="service" value="support">
                    Support
                </label>
            </fieldset>

            <label class="span-all">
                Message
                <textarea name="message"></textarea>
            </label>

            <button type="submit">Submit</button>
        </form>
    </div>

    <aside>
        <h3>Contact Information</h3>
        <p>Contact us to schedule your appointment.</p>
    </aside>
</section>

    
</body>
</html>
